[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "robomp"
version = "0.1.0"
description = "Self-hosted GitHub triage/fix bot driving omp --mode rpc"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Stencil Labs, Inc." }]
dependencies = [
  "fastapi>=0.165",
  "uvicorn[standard]>=0.54",
  "httpx>=0.28.1",
  "pydantic>=2.14.3",
  "pydantic-settings>=2.16.3",
  "python-dotenv>=1.2.4",
  "click>=8.5.1",
  "omp-rpc>=0.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.2.0",
  "pytest-asyncio>=1.5.0",
  "respx>=0.23.1",
  "ruff>=0.17.5",
]

[project.scripts]
robomp = "robomp.cli:main"

[tool.setuptools]
package-dir = { "robomp" = "src" }
packages = ["robomp", "robomp.proxy"]

[tool.setuptools.package-data]
robomp = ["prompts/*", "py.typed", "static/*", "static/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".pi-context", "data"]

[tool.ruff.lint]
select = [
  "E", "W",  # pycodestyle
  "F",       # pyflakes
  "I",       # isort
  "UP",      # pyupgrade
  "B",       # flake8-bugbear
  "C4",      # comprehensions
  "PIE",     # misc lints
]
ignore = [
  "E501",  # long lines (embedded HTML/SQL/prompts); formatter handles real cases
  "B008",  # FastAPI/Click rely on call-in-defaults (Depends, Option)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # assert False is fine in tests

[tool.ruff.lint.isort]
known-first-party = ["robomp"]

[tool.ruff.format]
quote-style = "double"
