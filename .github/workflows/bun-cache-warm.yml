name: Warm bun store cache

# Produces the shared `bun-<os>-<lockhash>` store entry Depot PR jobs restore.
# PR jobs restore it but never save (per-PR-ref copies of the ~500 MB store once
# ate ~9.4 GB of the 10 GB repo cache quota), bun-install's save half only runs
# on non-PR events, and this job runs on Depot, so the entry lives in the Depot
# cache: the two GitHub-hosted npm publishers keep their own GitHub-cache entries
# through their inline restore and save steps instead. Triggers only on pushes
# that can change the entry.

on:
   push:
      branches: [main]
      paths:
         - "bun.lock"
         - ".github/actions/bun-install/**"
         - ".github/workflows/bun-cache-warm.yml"
   workflow_dispatch:

permissions:
   contents: read

# No cancel-in-progress: a cancelled warm saves nothing. Superseded queued runs
# still collapse to the newest one.
concurrency:
   group: bun-cache-warm
   cancel-in-progress: false

jobs:
   warm_bun:
      name: Seed bun store cache
      runs-on: depot-ubuntu-22.04
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
